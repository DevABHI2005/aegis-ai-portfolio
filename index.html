
<!doctype html>
<html lang="en">
  <head>
    <!-- Character Encoding -->
    <meta charset="UTF-8" />

    <!-- Responsive Design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Abhiram Bhairavabhotla | Data Analytics & AI Developer</title>

    <meta
      name="description"
      content="Explore Abhiram Bhairavabhotla's portfolio featuring projects and experience in Data Analytics, Data Engineering, Python, SQL, cloud technologies and AI."
    />

    <meta
      name="author"
      content="Abhiram Bhairavabhotla"
    />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large"
    />

    <meta
      name="application-name"
      content="AEGIS AI Portfolio"
    />

    <!-- Browser Theme -->
    <meta name="theme-color" content="#05070a" />
    <meta name="color-scheme" content="dark" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts -->
    

    <!-- Open Graph / LinkedIn / WhatsApp -->
    <meta property="og:type" content="website" />

    <meta
      property="og:title"
      content="Abhiram Bhairavabhotla | Data Analytics & AI Developer"
    />

    <meta
      property="og:description"
      content="Explore my technical projects, skills and experience in Data Analytics, Data Engineering and AI."
    />

    <meta
      property="og:site_name"
      content="AEGIS AI | Abhiram's Portfolio"
    />

    <meta property="og:locale" content="en_IN" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="Abhiram Bhairavabhotla | Portfolio"
    />

    <meta
      name="twitter:description"
      content="Data Analytics, Data Engineering and AI projects by Abhiram Bhairavabhotla."
    />

    <!-- Prevent automatic phone/email detection formatting -->
    <meta name="format-detection" content="telephone=no" />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
